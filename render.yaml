# Render Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий.
# Поднимает PostgreSQL и веб-сервис из Dockerfile; миграции и сид выполняются при старте.
services:
  - type: web
    name: cv-graphql
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-graphql-db
          property: connectionString

databases:
  - name: cv-graphql-db
    plan: free
